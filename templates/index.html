<h2>Welcome {{ session.user }}</h2>

<a href="/logout">Logout</a>

<form action="/add" method="POST">
    <input type="text" name="note" required>
    <button>Add Note</button>
</form>

<ul>
    {% for note in notes %}
    <li>
        {{ note.text }}
        <a href="/delete/{{ note._id }}">Delete</a>
    </li>
    {% endfor %}
</ul>
